<div class="login-wrapper">
  <div class="login-card">
      <div class="login-logo">
          <span class="brand-mark login-brand-mark">PCP</span>
          <h2>PCPView</h2>
          <h3>CONTROLE DE PRODUÇÃO</h3>
      </div>

      <!-- Alerta de Erro -->
      <div *ngIf="errorMessage" class="error-alert" role="alert" aria-live="assertive">
          {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="form-group">
              <label for="login-email">Identificação (E-mail ou Crachá)</label>
              <input 
                id="login-email"
                type="text" 
                name="email" 
                [(ngModel)]="email" 
                placeholder="Ex: admin@empresa.com" 
                autocomplete="username"
                required>
          </div>
          <div class="form-group">
              <label for="login-password">Senha</label>
              <input 
                id="login-password"
                type="password" 
                name="password" 
                [(ngModel)]="password" 
                placeholder="******" 
                autocomplete="current-password"
                required>
          </div>
          
          <button 
            type="submit" 
            class="btn btn-blue btn-full mt-4" 
            [disabled]="isLoading || !loginForm.valid">
            {{ isLoading ? 'Autenticando...' : 'Entrar no Sistema' }}
          </button>
      </form>
  </div>
</div>
