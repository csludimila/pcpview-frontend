<main class="login-wrapper" role="main">
  <div class="login-card">
    <header class="login-logo">
      <span class="brand-mark login-brand-mark" aria-hidden="true">PCP</span>
      <h1>PCPView</h1>
      <p class="subtitle">CONTROLE DE PRODUÇÃO</p>
    </header>

    <!-- Alerta de Erro com ID para descrição acessível -->
    <div 
      *ngIf="errorMessage" 
      id="login-error"
      class="error-alert" 
      role="alert" 
      aria-live="assertive"
      aria-atomic="true">
      <span class="error-icon" aria-hidden="true">!</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="login-email">Identificação (E-mail ou Crachá)</label>
        <input 
          id="login-email"
          type="text" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="Ex: adminEquipSea@gmail.com" 
          autocomplete="username"
          required
          [attr.aria-invalid]="errorMessage ? 'true' : 'false'"
          [attr.aria-describedby]="errorMessage ? 'login-error' : null">
      </div>

      <div class="form-group">
        <label for="login-password">Senha</label>
        <input 
          id="login-password"
          type="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="Digite sua senha" 
          autocomplete="current-password"
          required
          [attr.aria-invalid]="errorMessage ? 'true' : 'false'"
          [attr.aria-describedby]="errorMessage ? 'login-error' : null">
      </div>
      
      <button 
        type="submit" 
        class="btn btn-blue btn-full" 
        [disabled]="isLoading || !loginForm.valid"
        [attr.aria-busy]="isLoading">
        {{ isLoading ? 'Autenticando...' : 'Entrar no Sistema' }}
      </button>
    </form>
  </div>
</main>
