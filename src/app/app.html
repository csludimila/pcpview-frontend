<div class="header container app-header" *ngIf="mostrarMenu">

  <div class="header-logo-area">
      <span class="brand-mark">PCP</span>
      <span class="brand-title">PCPView</span>
  </div>

  <nav class="nav-menu" aria-label="Navegação principal">
      <a *ngIf="isAdmin()" class="btn nav-btn" routerLink="/planejamento" routerLinkActive="active" aria-label="Abrir Planejamento"><span class="nav-code">PL</span> Planejamento</a>
      <a class="btn nav-btn" routerLink="/operacao" routerLinkActive="active" aria-label="Abrir Operação"><span class="nav-code">OP</span> Operação</a>
      <a class="btn nav-btn" routerLink="/acompanhamento" routerLinkActive="active" aria-label="Abrir Acompanhamento"><span class="nav-code">AC</span> Acompanhamento</a>
      <a class="btn nav-btn" routerLink="/maquinas" routerLinkActive="active" aria-label="Abrir Máquinas"><span class="nav-code">MQ</span> Máquinas</a>
      <a *ngIf="isAdmin()" class="btn nav-btn" routerLink="/cadastro" routerLinkActive="active" aria-label="Abrir Usuários"><span class="nav-code">US</span> Usuários</a>
  </nav>

  <div class="header-user-area">
      <span id="user-info">{{ userLabel }}</span>
      <button class="btn btn-red logout-btn" type="button" (click)="fazerLogout()" aria-label="Sair do sistema">Sair</button>
  </div>

</div>

<div class="container global-error" *ngIf="erroGlobal" role="alert" aria-live="assertive">
  <span>{{ erroGlobal }}</span>
  <button type="button" class="global-error-close" (click)="limparErroGlobal()" aria-label="Fechar aviso">×</button>
</div>

<div class="container-fluid app-content">
  <router-outlet></router-outlet>
</div>
