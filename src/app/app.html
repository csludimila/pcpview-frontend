<div class="header container" *ngIf="mostrarMenu" style="margin-top: 20px;">
  
  <div class="header-logo-area" style="display: flex; align-items: center; gap: 15px;">
      <span class="brand-mark">PCP</span>
      <span class="brand-title">PCPView</span>
  </div>

  <div class="nav-menu">
      <a *ngIf="isAdmin()" class="btn nav-btn" routerLink="/planejamento" routerLinkActive="active">🏢 Planejamento</a>
      <a class="btn nav-btn" routerLink="/operacao" routerLinkActive="active">⚙️ Operação</a>
      <a class="btn nav-btn" routerLink="/acompanhamento" routerLinkActive="active">⏳ Acompanhamento</a>
      <a class="btn nav-btn" routerLink="/maquinas" routerLinkActive="active">🏭 Máquinas</a>
  </div>

  <div class="header-user-area" style="display: flex; align-items: center;">
      <span id="user-info" style="font-weight: bold; color: var(--accent);">{{ userLabel }}</span>
      <button class="btn btn-red" style="margin-left: 15px;" (click)="fazerLogout()">Sair</button>
  </div>

</div>

<div class="container-fluid" style="padding: 0;"> 
  <router-outlet></router-outlet>
</div>
