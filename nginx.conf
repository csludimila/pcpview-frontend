server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net; connect-src 'self' http://localhost:8080 https:; img-src 'self' data: https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; font-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net; frame-src https://vlibras.gov.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
